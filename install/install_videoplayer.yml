---
- name: Install and configure video player
  hosts: video_player
  become: true
  vars_files:
    - ../vars/vault.yml
    - ../vars/program_versions.yml
  vars:
    repo_dir: "/home/{{ ansible_user }}/video-player"
    repo_url: "https://github.com/tu-studio/video-server.git"
    local_temp_dir: "/tmp/video-server"

  tasks:
    - name: Clone video-server locally on control machine
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ local_temp_dir }}"
        version: "{{ video_player_version }}"
        update: true
      delegate_to: localhost
      run_once: true
      become: false

    - name: Install packages (if repository cache available)
      ansible.builtin.apt:
        name:
          - mpv
          - socat
        state: present

    - name: Ensure target video-player directory exists
      ansible.builtin.file:
        path: "{{ repo_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: avm
        mode: "0755"

    # for some reason, this is a million times faster than just using built in copy
    - name: Synchronize video-server files from controller to target host
      ansible.posix.synchronize:
        src: "{{ local_temp_dir }}/"
        dest: "{{ repo_dir }}/"
      become: false

    - name: Set ownership of video-server files
      ansible.builtin.file:
        path: "{{ repo_dir }}"
        owner: "{{ ansible_user }}"
        group: avm
        recurse: true

    - name: Ensure ~/.config/mpv directory exists
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.config/mpv"
        state: directory
        owner: "{{ ansible_user }}"
        group: avm
        mode: "0755"

    - name: Generate ~/.config/mpv/mpv.conf from template
      ansible.builtin.template:
        src: "{{ local_temp_dir }}/mpv.conf.j2"
        dest: "/home/{{ ansible_user }}/.config/mpv/mpv.conf"
        owner: "{{ ansible_user }}"
        group: avm
        mode: "0644"

    - name: Ensure /etc/systemd/user directory exists
      ansible.builtin.file:
        path: /etc/systemd/user
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy user service units to /etc/systemd/user
      ansible.builtin.copy:
        src: "{{ local_temp_dir }}/systemd/{{ item }}"
        dest: "/etc/systemd/user/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - mpv.service
        - mpv-udp-bridge.service

    - name: Systemd user daemon reload
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      become_user: "{{ ansible_user }}"

    - name: Enable and restart systemd user services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: restarted
        scope: user
      become_user: "{{ ansible_user }}"
      loop:
        - mpv-udp-bridge.service
        - mpv.service
