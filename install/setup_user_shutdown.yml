---
- name: Setup permissions for shutdown
  hosts: all
  become: true
  vars_files:
    - ../vars/vault.yml
  tasks:
    - name: Create Shutdown group
      ansible.builtin.group:
        name: shutdown
        state: present
    - name: Add user to shutdown group
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: shutdown
        append: true
    - name: Allow the shutdown group to use shutdown
      community.general.sudoers:
        name: allow-shutdown
        state: present
        group: shutdown
        commands: [/sbin/shutdown, /sbin/reboot, /sbin/poweroff]
    - name: Put sudo in front of shutdown in humboldt-probe
      ansible.builtin.lineinfile:
        backrefs: true
        state: present
        path: /home/tu-studio/humboldt_probe/src/methods/__init__.py
        regexp: '^(\s*)result = os\.system\(''shutdown now''\)$'
        line: '\1result = os.system(''sudo shutdown now'')'
      become: true
    - name: Put sudo in front of reboot in humboldt-probe
      ansible.builtin.lineinfile:
        backrefs: true
        state: present
        path: /home/tu-studio/humboldt_probe/src/methods/__init__.py
        regexp: '^(\s*)result = os\.system\(''reboot now''\)$'
        line: '\1result = os.system(''sudo reboot now'')'
      become: true

